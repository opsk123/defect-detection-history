<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결함 탐지 이력</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --fg:#1d2127; --muted:#6b7480; --line:#e2e5ea; --accent:#2563eb;
          --sawing:#ff8c00; --fracture:#e62828; --splitting:#1e90ff; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#14161a; --card:#1d2025; --fg:#e8eaed; --muted:#9aa3ae; --line:#2c3037; --accent:#6ea0ff; }
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:15px/1.5 system-ui,"Malgun Gothic",sans-serif; }
  main { max-width:1100px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:22px; margin:0 0 4px; }
  .sub { color:var(--muted); margin:0 0 20px; }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:20px; }
  .stat { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .stat b { display:block; font-size:24px; }
  .stat span { color:var(--muted); font-size:13px; }
  .bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:16px; }
  .chip { border:1px solid var(--line); background:var(--card); color:var(--fg); border-radius:999px;
          padding:5px 14px; cursor:pointer; font:inherit; }
  .chip[aria-pressed="true"] { background:var(--accent); border-color:var(--accent); color:#fff; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .card img { width:100%; aspect-ratio:4/3; object-fit:contain; background:#000; display:block; cursor:zoom-in; }
  .card .body { padding:10px 12px; }
  .meta { color:var(--muted); font-size:12.5px; }
  .tags { margin-top:6px; display:flex; flex-wrap:wrap; gap:4px; }
  .tag { font-size:12px; color:#fff; padding:1px 8px; border-radius:999px; }
  .tag.sawing { background:var(--sawing); } .tag.fracture { background:var(--fracture); } .tag.splitting { background:var(--splitting); }
  .tag.none { background:var(--muted); }
  .empty { background:var(--card); border:1px dashed var(--line); border-radius:10px; padding:32px; text-align:center; color:var(--muted); }
  h2 { font-size:17px; margin:32px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; font-size:13.5px; }
  th,td { padding:7px 10px; text-align:right; border-bottom:1px solid var(--line); }
  th:first-child,td:first-child,th:nth-child(2),td:nth-child(2) { text-align:left; }
  dialog { border:0; padding:0; background:transparent; max-width:96vw; }
  dialog::backdrop { background:rgba(0,0,0,.8); }
  dialog img { max-width:96vw; max-height:92vh; display:block; }
  .scroll { overflow-x:auto; }
</style>
</head>
<body>
<main>
  <h1>결함 탐지 이력</h1>
  <p class="sub">YOLO26n 으로 검출한 sawing · fracture · splitting 결과 기록 <span id="updated"></span></p>

  <section class="stats" id="stats"></section>

  <div class="bar" id="filters" role="group" aria-label="클래스 필터"></div>
  <section class="grid" id="grid"></section>

  <h2>모델 성능 (평가 데이터)</h2>
  <div class="scroll"><table id="metrics"></table></div>
</main>
<dialog id="dlg"><img id="dlgimg" alt="탐지 결과 확대"></dialog>

<script>
const CLASSES = ["sawing", "fracture", "splitting"];
let history = [], filter = "all";
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function renderStats() {
  const total = history.length;
  const defects = history.reduce((n, h) => n + h.detections.length, 0);
  const withDef = history.filter(h => h.detections.length).length;
  const avgMs = total ? history.reduce((n, h) => n + h.inference_ms, 0) / total : 0;
  const counts = Object.fromEntries(CLASSES.map(c => [c, 0]));
  history.forEach(h => h.detections.forEach(d => counts[d.class] = (counts[d.class] || 0) + 1));
  const items = [["탐지 실행", total], ["결함 발견 이미지", withDef], ["검출된 결함 수", defects],
                 ["평균 추론(ms)", avgMs.toFixed(1)], ...CLASSES.map(c => [c, counts[c]])];
  $("stats").innerHTML = items.map(([k, v]) => `<div class="stat"><b>${v}</b><span>${esc(k)}</span></div>`).join("");
}

function renderFilters() {
  const opts = ["all", ...CLASSES];
  $("filters").innerHTML = opts.map(o =>
    `<button class="chip" data-f="${o}" aria-pressed="${filter === o}">${o === "all" ? "전체" : o}</button>`).join("");
  $("filters").querySelectorAll("button").forEach(b => b.onclick = () => { filter = b.dataset.f; renderFilters(); renderGrid(); });
}

function renderGrid() {
  const list = history.filter(h => filter === "all" || h.detections.some(d => d.class === filter));
  if (!list.length) {
    $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1">${history.length ? "조건에 맞는 이력이 없습니다." :
      "아직 탐지 이력이 없습니다.<br>앱(app.py)에서 검출을 실행한 뒤 <code>publish_history.bat</code> 를 실행하면 여기에 표시됩니다."}</div>`;
    return;
  }
  $("grid").innerHTML = list.map(h => {
    const tags = h.detections.length
      ? h.detections.map(d => `<span class="tag ${esc(d.class)}">${esc(d.class)} ${d.conf.toFixed(2)}</span>`).join("")
      : `<span class="tag none">검출 없음</span>`;
    return `<article class="card"><img loading="lazy" src="${esc(h.image)}" alt="탐지 결과 ${esc(h.time)}" data-src="${esc(h.image)}">
      <div class="body"><div>${esc(h.time.replace("T", " "))}</div>
      <div class="meta">${esc(h.source)} · 모델 ${esc(h.model)} · 임계값 ${h.conf} · ${h.inference_ms} ms</div>
      <div class="tags">${tags}</div></div></article>`;
  }).join("");
  $("grid").querySelectorAll("img").forEach(i => i.onclick = () => { $("dlgimg").src = i.dataset.src; $("dlg").showModal(); });
}

async function load() {
  try {
    const r = await fetch("data/history.json", { cache: "no-cache" });
    history = r.ok ? await r.json() : [];
  } catch { history = []; }
  if (history.length) $("updated").textContent = "· 최근 " + history[0].time.replace("T", " ");
  renderStats(); renderFilters(); renderGrid();
  try {
    const t = await (await fetch("data/results_summary.csv")).text();
    const rows = t.trim().split(/\r?\n/).map(l => l.split(","));
    $("metrics").innerHTML = "<thead><tr>" + rows[0].map(c => `<th>${esc(c)}</th>`).join("") + "</tr></thead><tbody>" +
      rows.slice(1).map(r => "<tr>" + r.map(c => `<td>${esc(c)}</td>`).join("") + "</tr>").join("") + "</tbody>";
  } catch { $("metrics").remove(); }
}
$("dlg").onclick = () => $("dlg").close();
load();
</script>
</body>
</html>
